name: Daily German Vocab

on:
  schedule:
    # GitHub cron is ALWAYS in UTC. 06:00 UTC = 08:00 in Italy during summer (CEST).
    # In winter (CET, from late October) change this to '0 7 * * *' to keep 08:00 local.
    - cron: '0 6 * * *'
  workflow_dispatch:   # adds a "Run workflow" button so you can test manually anytime

permissions:
  contents: write      # needed so the job can commit progress.json back to the repo

jobs:
  send-lesson:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send daily German lesson
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python german_daily_bot.py --once

      - name: Save updated progress.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add progress.json
          git commit -m "Update learning progress [skip ci]" || echo "No changes to commit"
          git push
